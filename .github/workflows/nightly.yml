name: Nightly

# 每次 push 到 main、每天台灣時間 02:00、或手動觸發，都會重新建 APK，
# 然後「更新同一個」nightly release（不會每次多一包）。
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *" # UTC 18:00 = 台灣 02:00
  workflow_dispatch:

# 同時間只跑一個，避免兩個 job 搶著改同一個 release
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  signing:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.configuration.outputs.ready }}
    steps:
      - name: Check signing configuration
        id: configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_ALIAS" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not configured; checks passed, signed release skipped."
          fi

  android:
    name: Build signed release APK
    needs: signing
    if: github.ref == 'refs/heads/main' && needs.signing.outputs.ready == 'true'
    # 釘住 runner 版本：ubuntu-latest 在 2026-10-19 會換成 Ubuntu 26，
    # 夜間建置不該因為 image 換版而默默壞掉。
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"

      # 不用 android-actions/setup-android：它會去裝已經被移除的 "tools" 套件而失敗。
      # GitHub 的 ubuntu runner 本來就裝好 Android SDK 了，直接用它的 sdkmanager。
      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          test -x "$MGR"
          # Runner 的 SDK licenses 已接受；安裝失敗必須阻止發布。
          "$MGR" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::repo secret KEYSTORE_BASE64 沒有設定（base64 後的 .jks 內容）"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks/release.jks"
          test -s "$RUNNER_TEMP/ks/release.jks" || { echo "::error::keystore 解出來是空的"; exit 1; }
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ks/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_ALIAS:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::repo secret KEYSTORE_ALIAS / KEYSTORE_PASSWORD 沒有設定"
            exit 1
          fi
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Remove signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/ks/release.jks"

      - name: Collect artifact
        id: apk
        run: |
          set -euo pipefail
          src=android/app/build/outputs/apk/release/app-release.apk
          test -s "$src"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$src"
          # 固定檔名，這樣每次都會覆蓋掉上一個，release 裡只留最新的一份
          cp "$src" autocoin-nightly.apk
          sha256sum autocoin-nightly.apk | tee autocoin-nightly.apk.sha256
          echo "sha=$(cut -d' ' -f1 autocoin-nightly.apk.sha256)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: signed-nightly
          retention-days: 3
          if-no-files-found: error
          path: |
            autocoin-nightly.apk
            autocoin-nightly.apk.sha256

  publish:
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: signed-nightly
      - name: Verify artifact
        id: apk
        run: |
          set -euo pipefail
          sha256sum --check autocoin-nightly.apk.sha256
          echo "sha=$(cut -d' ' -f1 autocoin-nightly.apk.sha256)" >> "$GITHUB_OUTPUT"

      - name: Update nightly release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Nightly · build ${{ github.run_number }}
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Signed release APK（每次更新都覆蓋這個 release）。

            - build: `${{ github.run_number }}`
            - versionName: `0.1.${{ github.run_number }}`
            - commit: `${{ github.sha }}`
            - sha256: `${{ steps.apk.outputs.sha }}`
            - 觸發: `${{ github.event_name }}` by `${{ github.actor }}`
          files: |
            autocoin-nightly.apk
            autocoin-nightly.apk.sha256

      - name: Point nightly tag at verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$RELEASE_SHA" -F force=true > /dev/null
          actual=$(gh api "repos/$GH_REPO/git/ref/tags/nightly" --jq '.object.sha')
          test "$actual" = "$RELEASE_SHA"
